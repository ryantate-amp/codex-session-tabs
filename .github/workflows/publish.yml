name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jetbrains-marketplace-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to JetBrains Marketplace
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      - name: Verify release version
        if: github.event_name == 'release'
        shell: bash
        run: |
          version="$(sed -n 's/^pluginVersion=//p' gradle.properties)"
          test "v${version}" = "${{ github.event.release.tag_name }}"

      - name: Verify
        run: ./gradlew clean test verifyPlugin --no-daemon

      - name: Publish
        shell: bash
        run: |
          set +e
          ./gradlew publishPlugin --no-daemon 2>&1 | tee publish.log
          status=${PIPESTATUS[0]}
          set -e

          if [[ ${status} -eq 0 ]]; then
            exit 0
          fi

          version="$(sed -n 's/^pluginVersion=//p' gradle.properties)"
          if grep -Fq "already contains version ${version}" publish.log; then
            echo "::notice::JetBrains Marketplace already contains version ${version}."
            exit 0
          fi

          exit "${status}"
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
